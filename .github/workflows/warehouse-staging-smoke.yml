name: Warehouse Staging v1 smoke tests

on:
  pull_request:
    paths:
      - 'zm-warehouse-staging-v1.js'
      - 'tests/warehouse-staging-v1.test.js'
      - 'zm-warehouse-out-v1.js'
      - 'zm-warehouse-out-v1.css'
      - 'zm-warehouse-out-pilot-preview-v1.js'
      - 'zm-warehouse-out-live-config-v1.js'
      - 'tests/warehouse-out-v1.test.js'
      - 'zm-warehouse-in-v1.js'
      - 'zm-warehouse-in-v1.css'
      - 'zm-warehouse-in-preview-config-v1.js'
      - 'tests/warehouse-in-v1.test.js'
      - 'WAREHOUSE_IN_SETUP.md'
      - '.github/workflows/warehouse-staging-smoke.yml'

permissions:
  contents: read

jobs:
  staging-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check staging JavaScript syntax
        run: node --check zm-warehouse-staging-v1.js
      - name: Run read-only Kintone mock tests
        run: node tests/warehouse-staging-v1.test.js
      - name: Check pilot config JavaScript syntax
        run: node --check zm-warehouse-out-pilot-preview-v1.js
      - name: Check live OUT configuration JavaScript syntax
        run: node --check zm-warehouse-out-live-config-v1.js
      - name: Check draft OUT JavaScript syntax
        run: node --check zm-warehouse-out-v1.js
      - name: Run draft OUT Kintone mock tests
        run: node tests/warehouse-out-v1.test.js
      - name: Check Warehouse IN script and preview config syntax
        run: node --check zm-warehouse-in-v1.js && node --check zm-warehouse-in-preview-config-v1.js
      - name: Run Universal Warehouse IN Kintone mock tests
        run: node tests/warehouse-in-v1.test.js
